<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Zixian Zhu — master's student at the School of Computer Science and Technology, Dalian University of Technology. Email: 3505943407@qq.com.">
  <meta name="theme-color" content="#f7f7f2">
  <title>Zixian Zhu | Academic Homepage</title>
  <style>
    :root { color-scheme: light; --paper: #f7f7f2; --ink: #232e31; --muted: #5a6669; --accent: #235d75; --line: #d4dcd9; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.7 "Segoe UI", "Microsoft YaHei", sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 64px 42px 40px; }
    .masthead { display: flex; justify-content: space-between; gap: 20px; align-items: baseline; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
    .eyebrow { font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
    a { color: var(--accent); text-underline-offset: .24em; text-decoration-thickness: 1px; }
    a:hover { color: var(--ink); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; border-radius: 2px; }
    .masthead a { font-size: 14px; }
    .identity { padding: 64px 0 42px; }
    h1 { font: 400 clamp(48px, 8vw, 76px)/1.1 Georgia, "Times New Roman", serif; letter-spacing: -.04em; margin: 0 0 24px; }
    .role { margin: 0 0 7px; color: var(--accent); font-weight: 600; }
    .affiliation { margin: 0; font-size: 19px; }
    .university { font-weight: 600; }
    .chinese { color: var(--muted); font-size: 15px; margin: 14px 0 0; }
    .details { border-top: 1px solid var(--line); display: grid; grid-template-columns: 170px 1fr; gap: 24px; padding: 32px 0 42px; }
    h2 { font: 400 25px/1.4 Georgia, "Times New Roman", serif; margin: 0; }
    dl { margin: 0; }
    dt { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 5px; }
    dd { margin: 0 0 22px; overflow-wrap: anywhere; }
    dd:last-child { margin-bottom: 0; }
    .email { font-size: 21px; }
    footer { border-top: 1px solid var(--line); padding-top: 18px; color: var(--muted); font-size: 13px; }
    @media (max-width: 600px) {
      main { padding: 28px 24px; }
      .identity { padding-top: 44px; }
      .details { grid-template-columns: 1fr; gap: 22px; }
      .affiliation { font-size: 17px; }
      .email { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main>
    <header class="masthead">
      <span class="eyebrow">Academic homepage</span>
      <a href="https://github.com/litterbr">GitHub ↗</a>
    </header>
    <section class="identity" aria-labelledby="name">
      <h1 id="name">Zixian Zhu</h1>
      <p class="role">Master’s student</p>
      <p class="affiliation">School of Computer Science and Technology<br><span class="university">Dalian University of Technology</span></p>
      <p class="chinese" lang="zh-CN">大连理工大学 · 计算机科学与技术学院 · 硕士研究生</p>
    </section>
    <section class="details" aria-labelledby="contact">
      <h2 id="contact">Contact</h2>
      <dl>
        <dt>Email</dt>
        <dd><a class="email" href="mailto:3505943407@qq.com">3505943407@qq.com</a></dd>
        <dt>GitHub</dt>
        <dd><a href="https://github.com/litterbr">github.com/litterbr</a></dd>
      </dl>
    </section>
    <footer>© Zixian Zhu</footer>
  </main>
</body>
</html>
